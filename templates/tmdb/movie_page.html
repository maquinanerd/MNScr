<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} ({{release_date}}) — Máquina Nerd</title>
<meta name="description" content="{{overview}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{overview}}">
<meta property="og:image" content="{{poster_url}}">
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.hero{position:relative;height:380px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.5)}
.hero-text{position:absolute;bottom:24px;left:32px}
.hero-text h1{margin:0;font-size:2.2em;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.container{max-width:960px;margin:0 auto;padding:32px 20px}
.meta{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0;font-size:.9em;color:#aaa}
.badge{background:#E50914;color:#fff;padding:4px 12px;border-radius:12px;font-size:.75em;font-weight:700}
.stars{color:#F5C518}
.poster{border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);width:180px}
.layout{display:flex;gap:32px;align-items:flex-start}
.info{flex:1}
.providers img{height:32px;border-radius:6px;margin-right:8px}
.tag{display:inline-block;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:12px;font-size:.78em;margin:3px}
.trailer-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;margin-top:24px}
.trailer-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.imdb-btn{display:inline-block;margin-top:12px;background:#F5C518;color:#000;padding:6px 16px;border-radius:6px;font-weight:700;text-decoration:none;font-size:.85em}
.credit{margin-top:32px;font-size:.72em;color:#484f58;text-align:right}
</style>
</head>
<body itemscope itemtype="https://schema.org/Movie">
<div class="hero">
  <img src="{{backdrop_url}}" alt="{{title}}" loading="lazy">
  <div class="hero-text">
    <span class="badge">🎬 Filme</span>
    <h1 itemprop="name">{{title}}</h1>
  </div>
</div>
<div class="container">
  <div class="layout">
    <img class="poster" src="{{poster_url}}" alt="Pôster {{title}}" loading="lazy">
    <div class="info">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span class="stars">⭐</span>
        <strong style="font-size:1.4em;color:#F5C518">{{rating}}</strong>
        <span style="color:#6e7681">({{vote_count}} votos TMDB)</span>
      </div>
      <div class="meta">
        <span itemprop="datePublished">📅 {{release_date}}</span>
        <span>⏱ {{runtime}}</span>
        <span itemprop="director">🎬 {{director}}</span>
        <span>💰 {{budget}} → {{revenue}}</span>
      </div>
      <div style="margin-bottom:12px">{{genres}}</div>
      <p itemprop="description" style="color:#8b949e;line-height:1.7">{{overview}}</p>
      <p><strong>Elenco:</strong> <span itemprop="actor">{{cast}}</span></p>
      <div class="providers">
        <strong>Onde assistir (BR):</strong> {{streaming}}
      </div>
      <a class="imdb-btn" href="https://www.imdb.com/title/{{imdb_id}}" target="_blank" rel="noopener">IMDb ↗</a>
    </div>
  </div>
  <div class="trailer-wrap">{{trailer_embed}}</div>
  <div class="credit">Dados: <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:#0d7adf">The Movie Database (TMDB)</a></div>
</div>
</body>
</html>
