# MNScr no Coolify (build pack "Docker Compose").
#
# Um serviço, um volume, nenhuma porta: o MNScr não serve HTTP — ele lê os superfeeds da
# Cinerie no RSS Prime e publica no CMS da Cinerie. Nenhum domínio a configurar.
#
# Nenhuma variável aqui é segredo. As chaves (Gemini, Payload/Cinerie, TMDB…) chegam no
# `.env` que o tools/coolify/enviar-estado.ps1 copia para o volume, junto com o banco. O
# que o Coolify define abaixo vence o `.env` (app/config.py carrega com override=False).

services:
  mnscr:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MNSCR_DB_PATH=/data/app.db
      - MNSCR_LOCAL_DRAFT_DIR=/data/drafts
      - TZ=America/Sao_Paulo
    volumes:
      - mnscr-data:/data
    restart: unless-stopped

volumes:
  mnscr-data:
