[project]
name = "mnscr"
version = "0.2.0"
description = "Motor editorial do Cinerie: gera drafts estruturados a partir de acontecimentos do RSS Prime"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.13.4",
    "feedparser>=6.0.11",
    # app/ai_client_gemini.py trata ResourceExhausted/GoogleAPICallError; a
    # dependencia era transitiva e precisa ser declarada para o lockfile instalar.
    "google-api-core>=2.25.0",
    "google-genai>=1.29.0",
    # MS-5/Cinerie: o contrato editorial-publication-request-v1 atravessa a
    # fronteira como JSON Schema draft 2020-12. Validar com um verificador
    # proprio criaria uma segunda leitura do mesmo schema.
    "jsonschema>=4.23.0",
    "lxml>=5.4.0",
    "python-dotenv>=1.1.1",
    "python-slugify>=8.0.4",
    "requests>=2.32.4",
    "trafilatura>=2.0.0",
    # Piso, nao pino: `urllib3==2.5.0` e `cryptography` 49.0.0 carregam
    # advisories conhecidos. Um pino exato impede o proprio conserto — foi ele
    # que segurou o lock na versao vulneravel mesmo com correcao publicada.
    "urllib3>=2.7.0",
    # Transitiva por `google-auth`, declarada aqui so para levantar o piso: sem
    # a declaracao, o resolvedor nao tem motivo para sair da versao vulneravel.
    "cryptography>=50.0.0",
    "charset-normalizer==3.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
