{% extends "base.html" %}
{% block title %}Primeiro acesso · Painel MNScr{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Primeiro acesso</h1>
  <p class="muted">Crie o administrador do painel do MNScr. Só quem tiver este usuário e esta senha entra.</p>
  <form method="post" action="/setup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="code">Código de primeiro acesso (no log do contêiner do painel, linha "[MNSCR_PAINEL] primeiro acesso")</label>
    <input id="code" name="code" type="text" autocomplete="off" required>
    <label for="user">Usuário</label>
    <input id="user" name="user" type="text" autocomplete="username" required>
    <label for="password">Senha (mínimo de 10 caracteres)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <label for="confirm">Repita a senha</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
    <p><button class="primary" type="submit">Criar administrador</button></p>
  </form>
</div>
{% endblock %}
